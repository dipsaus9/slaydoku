<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Slaydoku</title>
    <meta name="description" content="Slaydoku: a new murder mystery puzzle every day. Read the clues, place every suspect and find out who was alone with the victim." />
    <!-- Set at build time from src/brand/site.json (the indexing switch, docs/launch.md). -->
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f2e6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2a2a36" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Home-screen app: manifest for Android/Chrome, apple-* meta for iOS Safari (checked by tools/check-share.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Slaydoku" />

    <!-- og:url, og:image, twitter:image and the canonical link are made absolute at build time by siteMetaPlugin (src/brand/site.ts). -->
    <!-- One static canonical for every route (same host as og:url): slaydoku.nl and www.slaydoku.nl both serve this build, so this is the SLAY-12.4 fix for the www vs apex duplicate-content risk. -->
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Slaydoku" />
    <meta property="og:title" content="Slaydoku" />
    <meta property="og:description" content="Slaydoku: a new murder mystery puzzle every day. Read the clues, place every suspect and find out who was alone with the victim." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Slaydoku: a magnifying glass over a puzzle grid, next to a floor plan with suspects. A new murder mystery puzzle every day." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Slaydoku" />
    <meta name="twitter:description" content="Slaydoku: a new murder mystery puzzle every day. Read the clues, place every suspect and find out who was alone with the victim." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
